# ── Build da imagem de desenvolvimento ───────────────────────────────────
# Publica ghcr.io/korflux/dev-lab-image:latest.
#
# Gatilhos:
#   - push na main: publica a imagem.
#   - schedule semanal: republica para incorporar correções de segurança
#     dos pacotes apt mesmo sem commits novos.
#   - pull_request: só builda, sem login e sem push (valida PRs, inclusive
#     os do Dependabot).
#
# Actions fixadas por SHA (comentário indica a versão); o Dependabot atualiza.
name: Build Development Image

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # segunda-feira, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Login só quando a imagem vai ser publicada; PRs não precisam.
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/korflux/dev-lab-image:latest
